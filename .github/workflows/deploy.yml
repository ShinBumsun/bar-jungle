name: 검사

# 카페24 는 한국 IP 에서만 FTP 쓰기를 허용하므로 GitHub 에서 직접 올릴 수 없습니다.
# 실제 업로드는 작업하는 컴퓨터의 git pre-push 훅이 맡고, 여기서는 검사만 합니다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP 문법 검사
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
          fail=0
          while IFS= read -r f; do
            php -l "$f" > /dev/null || { echo "문법 오류: $f"; fail=1; }
          done < <(find gnuboard -name '*.php')
          echo "검사한 PHP 파일: $(find gnuboard -name '*.php' | wc -l)개"
          exit $fail

      - name: 자바스크립트 문법 검사
        run: |
          for f in gnuboard/theme/bar-jungle/js/*.js tools/*.py; do
            case "$f" in
              *.js) node --check "$f" || exit 1 ;;
              *.py) python3 -c "import ast,sys;ast.parse(open(sys.argv[1]).read())" "$f" || exit 1 ;;
            esac
          done
          echo "통과"

      - name: 실서비스 상태 확인
        run: |
          code=$(curl -s -o /tmp/out.html -w '%{http_code}' --max-time 60 https://jungle2304.mycafe24.com/)
          echo "HTTP $code"
          test "$code" = "200" || { echo "사이트가 200 을 돌려주지 않습니다"; exit 1; }
          grep -q 'mgl_item' /tmp/out.html || { echo "메뉴가 출력되지 않았습니다"; exit 1; }
          if grep -qiE 'Fatal error|Parse error' /tmp/out.html; then echo "PHP 오류가 출력되었습니다"; exit 1; fi
          echo "메뉴 항목 $(grep -o 'mgl_item' /tmp/out.html | wc -l)개 확인"
